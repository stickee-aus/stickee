name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (no values ever printed)
        run: node scripts/secret-scan.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      # continue-on-error is temporary: this repo had zero ESLint coverage
      # before Implementation Batch 1. The real, unmodified Next.js config
      # surfaces ~65 pre-existing errors across files this batch didn't
      # touch (see TEST_AND_VERIFICATION_REPORT.md for the exact count and
      # confirmation none are in this batch's diff). Blocking merges on
      # pre-existing debt on day one isn't useful; the output below still
      # shows up in every CI run so it isn't hidden. Remove
      # continue-on-error once a dedicated lint-cleanup batch lands.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
